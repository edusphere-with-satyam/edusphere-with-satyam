function loadQuiz() {

    const quiz = document.getElementById("quiz");

    questions.forEach((item, index) => {

        let html = `
        <div class="question">
            <h3>${item.q}</h3>
        `;

        item.o.forEach((option, optionIndex) => {

            html += `
            <label class="option">
                <input type="radio"
                       name="question${index}"
                       value="${optionIndex}">
                ${String.fromCharCode(65 + optionIndex)}. ${option}
            </label>
            `;

        });

        html += `</div>`;

        quiz.innerHTML += html;

    });

}

function submitQuiz() {

    let score = 0;
    let attempted = 0;

    questions.forEach((item, index) => {

        const selected =
            document.querySelector(
                `input[name="question${index}"]:checked`
            );

        const options =
            document.querySelectorAll(
                `input[name="question${index}"]`
            );

        if (selected) {

            attempted++;

            if (Number(selected.value) === item.a) {
                score++;
            }

        }

        options.forEach(input => {

            const label = input.parentElement;

            label.classList.remove("correct");
            label.classList.remove("wrong");

            if (Number(input.value) === item.a) {
                label.classList.add("correct");
            }

            if (
                selected &&
                input === selected &&
                Number(input.value) !== item.a
            ) {
                label.classList.add("wrong");
            }

        });

    });

    const percentage = (score / 100) * 100;

    document.getElementById("result").innerHTML =
        "Score: " + score + " / 100" +
        "<br>Attempted: " + attempted + " / 100" +
        "<br>Percentage: " + percentage.toFixed(2) + "%";

}

function reattempt() {

    document.querySelectorAll(
        "input[type='radio']"
    ).forEach(input => {
        input.checked = false;
    });

    document.querySelectorAll(
        ".option"
    ).forEach(label => {
        label.classList.remove("correct");
        label.classList.remove("wrong");
    });

    document.getElementById("result").innerHTML = "";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

loadQuiz();
