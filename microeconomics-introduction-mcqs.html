const container = document.getElementById("questions");

questions.forEach((q,index)=>{

    let html = `
    <div class="question" id="question${index}">
    <h3>Q${index+1}. ${q[0]}</h3>
    `;

    q[1].forEach((option,optionIndex)=>{

        html += `
        <label class="option" id="q${index}o${optionIndex}">
        <input type="radio" name="q${index}" value="${optionIndex}">
        ${option}
        </label>
        `;

    });

    html += `</div>`;

    container.innerHTML += html;

});


function submitQuiz(){

    let score = 0;

    questions.forEach((q,index)=>{

        const selected = document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const correct = q[2];

        for(let i=0;i<q[1].length;i++){

            document.getElementById(`q${index}o${i}`)
            .classList.remove("correct","wrong");

        }

        document.getElementById(`q${index}o${correct}`)
        .classList.add("correct");

        if(selected){

            if(Number(selected.value) === correct){

                score++;

            }else{

                document.getElementById(
                    `q${index}o${selected.value}`
                ).classList.add("wrong");

            }

        }

    });


    let percentage = (score / questions.length) * 100;

    let message = "";

    if(percentage >= 80){
        message = "Excellent work! 🎉";
    }
    else if(percentage >= 60){
        message = "Good job! Keep practising. 👍";
    }
    else if(percentage >= 40){
        message = "Keep learning and try again. 📚";
    }
    else{
        message = "Don't worry. Revise the unit and reattempt. 💪";
    }


    const result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML = `
    <h2>Your Result</h2>
    <h1>${score} / ${questions.length}</h1>
    <p><strong>Percentage: ${percentage.toFixed(1)}%</strong></p>
    <p>${message}</p>
    `;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}
